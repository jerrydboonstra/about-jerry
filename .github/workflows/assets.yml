name: assets

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  card:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: card
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.18
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check
